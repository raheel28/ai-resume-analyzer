# Render blueprint: ONE web service that serves both the React site and the API.
# Set GEMINI_API_KEY in the Render dashboard when asked (never commit it).
services:
  - type: web
    name: ai-resume-analyzer
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free            # free sleeps after 15 min idle; "starter" ($7/mo) stays awake
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-3.5-flash
      - key: LLM_FALLBACK_MODELS
        value: gemini-3.1-flash-lite,gemini-3.8-flash
      - key: LLM_TIMEOUT_S
        value: "25"
      - key: TRUST_PROXY        # Render sits behind a proxy; needed to rate-limit by real IP
        value: "1"
      - key: AI_RATE_LIMIT      # per visitor; protects your Gemini quota
        value: 10/hour
      - key: BASIC_RATE_LIMIT
        value: 60/minute
