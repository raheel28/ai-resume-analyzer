name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # Unit tests + eval thresholds (no API key needed; AI is faked).
      - run: pytest -q
        env:
          METRICS_DISABLED: "1"
      - name: Eval report
        run: |
          python -m evals.run_guard --set dev
          python -m evals.run_guard --set holdout --show-errors
          python -m evals.run_keywords --show-errors

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install
      - run: npm run build

  # Builds the same single-service image Render deploys, so a broken
  # Dockerfile shows up here instead of as a failed deploy.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-resume-analyzer .
      - name: Smoke test (site + API from one container)
        run: |
          docker run -d -p 8000:8000 --name app ai-resume-analyzer
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 1; done
          curl -sf localhost:8000/api/health | grep '"status":"ok"'
          curl -sf localhost:8000/ | grep -q '<div id="root">'
          echo "API and frontend both served"
